services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: fkb-qdrant
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_storage:/qdrant/storage

  indexer:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file:
      - .env
    volumes:
      - ./knowledge:/knowledge:ro
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      - qdrant
    command: ["python", "-m", "fkb.indexer"]

  search:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file:
      - .env
    volumes:
      - ./knowledge:/knowledge:ro
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      - qdrant
    entrypoint: ["python", "-m", "fkb.search"]

  mcp:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: fkb-mcp
    env_file:
      - .env
    volumes:
      - ./knowledge:/knowledge:ro
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      - qdrant
    command: ["python", "-m", "fkb.mcp_server"]

  admin:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: fkb-admin
    env_file:
      - .env
    volumes:
      - ./knowledge:/knowledge:ro
      - ./config.yaml:/app/config.yaml:ro
      # Laboratory mode example:
      # - type: bind
      #   source: /home
      #   target: /host_home
      #   read_only: true
      #   bind:
      #     propagation: rslave
    ports:
      - "8080:8080"
    depends_on:
      - qdrant
    command: ["uvicorn", "fkb.admin:app", "--host", "0.0.0.0", "--port", "8080"]
