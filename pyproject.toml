[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "filesystem-knowledge-bridge"
version = "0.2.0"
description = "Lightweight project knowledge indexer and MCP bridge for Qdrant"
requires-python = ">=3.11"
dependencies = [
    "qdrant-client>=1.14",
    "llama-index-core>=0.12",
    "llama-index-vector-stores-qdrant>=0.4",
    "llama-index-readers-file>=0.4",
    "llama-index-embeddings-openai>=0.3",
    "llama-index-embeddings-openai-like>=0.3.1",
    "tree-sitter-language-pack>=0.8",
    "pypdf>=5",
    "python-pptx>=1.0",
    "docx2txt>=0.8",
    "httpx>=0.27",
    "mcp>=1.9,<2",
]

[project.scripts]
kb-index = "kb_index:main"
kb-search = "kb_search:main"
kb-read-mcp = "kb_read_mcp:main"
kb-register-mcp = "kb_register_mcp:main"

[tool.setuptools]
py-modules = [
    "kb_common",
    "kb_index",
    "kb_search_core",
    "kb_search",
    "kb_register_core",
    "kb_read_mcp",
    "kb_register_mcp",
]
package-dir = {"" = "src"}
